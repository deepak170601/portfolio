<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Chekurthi Deepak — Java Backend Engineer</title>
    <meta
      name="description"
      content="Java backend engineer building distributed, event-driven systems on Spring Boot, JMS and AWS — and proving they work: an error-recovery framework across 111 services, and retrieval tuned against labelled evaluation sets."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Chekurthi Deepak — Java Backend Engineer" />
    <meta
      property="og:description"
      content="Java backend engineer building distributed, event-driven systems on Spring Boot, JMS and AWS — and proving they work: an error-recovery framework across 111 services, and retrieval tuned against labelled evaluation sets."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      // Applied before first paint so the correct theme never flashes.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) {
          /* private mode, blocked storage - fall through to the OS preference */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
